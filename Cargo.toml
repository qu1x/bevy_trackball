[package]
name = "bevy_trackball"
version = "0.16.0"
rust-version = "1.97.1"
edition = "2024"
authors = ["Rouven Spreckels <rs@qu1x.dev>"]
description = "Coherent virtual trackball controller/camera plugin for Bevy"
homepage = "https://qu1x.dev/bevy_trackball"
documentation = "https://doc.qu1x.dev/bevy_trackball"
repository = "https://github.com/qu1x/bevy_trackball"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = [
    "virtual-trackball",
    "exponential-map",
    "coherent-rotation",
    "pan-orbit",
    "bevy-camera",
]
categories = [
    "graphics",
    "rendering",
    "game-engines",
    "science",
]
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "Cargo.toml",
    "README.md",
    "RELEASES.md",
    "LICENSE-*",
]

[package.metadata.docs.rs]
features = ["serialize"]
cargo-args = ["-Z", "unstable-options", "-Z", "rustdoc-scrape-examples"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
c11-orbit = ["trackball/cc"]
serialize = ["bevy/serialize", "trackball/serde", "bevy_egui?/serde"]
bevy_egui = ["dep:bevy_egui"]

[dependencies]
trackball = "0.19.0"
bevy_egui = { version = "0.43.1", default-features = false, features = ["render"], optional = true }

[dependencies.bevy]
version = "0.20.1"
default-features = false
features = [
    "bevy_render",
    "bevy_window",
    "trace",
]

[dev-dependencies.bevy]
version = "0.20.1"
default-features = false
features = [
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_picking",
    "bevy_post_process",
    "bevy_winit",
    "custom_cursor",
    "multi_threaded",
    "ktx2",
    "tonemapping_luts",
    "wayland",
    "webgl2",
    "zstd_rust",
]

[[example]]
name = "exponential_map"
required-features = []
doc-scrape-examples = true
[[example]]
name = "gliding_clamp"
required-features = ["bevy/bevy_ui_render", "bevy/default_font"]
doc-scrape-examples = true
[[example]]
name = "constellation_clamp"
required-features = ["bevy/bevy_ui_render", "bevy/default_font"]
doc-scrape-examples = true
[[example]]
name = "egui"
required-features = ["bevy_egui/default_fonts"]
doc-scrape-examples = true
[[example]]
name = "scaling_modes"
required-features = []
doc-scrape-examples = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
missing_docs = "forbid"

[lints.rustdoc]
broken_intra_doc_links = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
